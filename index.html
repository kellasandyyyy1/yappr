<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Yappr — a social web app</title>
    <meta name="description" content="Yappr is a social app for posts, group chats and direct messages." />
    <!-- Paints the browser/OS chrome. Must match `theme_color` in the manifest,
         or an installed window and a browser tab render different title bars
         for the same app. -->
    <meta name="theme-color" content="#123B8C" />
    <!-- iOS reads these rather than the manifest for home-screen launches. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yappr" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Icons. The SVG is preferred by browsers that support it and stays sharp
         at any size; the .ico is the fallback, and is also what a browser
         requests unprompted at /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/favicon/yappr-penguins-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <!-- No <link rel="manifest"> here on purpose. vite-plugin-pwa injects one
         at build time, and `injectRegister: null` only suppresses the
         registration *script* — not the manifest link. Declaring it manually as
         well produced two identical links in dist/index.html. -->


    <!-- Social previews. Scrapers do not execute JavaScript and will not render
         SVG, so these point at the pre-rendered PNG. Absolute URLs are required
         by most scrapers; VITE_PUBLIC_ORIGIN should be set at build time if the
         deployed origin is not the one serving this file. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yappr" />
    <meta property="og:title" content="Yappr" />
    <meta property="og:description" content="A social app for posts, group chats and direct messages." />
    <meta property="og:image" content="/favicon/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Two penguins chatting, beside the Yappr wordmark" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yappr" />
    <meta name="twitter:description" content="A social app for posts, group chats and direct messages." />
    <meta name="twitter:image" content="/favicon/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
